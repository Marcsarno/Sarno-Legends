<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarno Legends · Build Log</title>
<style>
  :root { --bg:#0e1416; --panel:#172124; --ink:#e9e2d0; --dim:#8d9a99; --red:#c8483a; --teal:#2fa39a; --gold:#e3b04b; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display:flex; align-items:baseline; gap:12px; padding:14px 16px 6px; flex-wrap:wrap; }
  h1 { margin:0; font-size:20px; letter-spacing:.08em; text-transform:uppercase; }
  h1 b { color:var(--red); } h1 i { color:var(--teal); font-style:normal; }
  .sub { color:var(--dim); font-size:13px; }
  main { max-width:1280px; margin:0 auto; padding:0 16px 24px; }
  .viewer { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:16/9; box-shadow:0 10px 40px #0008; }
  .viewer img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transition:opacity .25s; }
  .viewer .badge { position:absolute; left:12px; top:12px; background:#000a; padding:4px 10px; border-radius:20px; font-size:12px; letter-spacing:.05em; }
  .controls { display:flex; gap:8px; align-items:center; margin:12px 0 8px; flex-wrap:wrap; }
  button { background:var(--panel); color:var(--ink); border:1px solid #2c3a3d; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--teal); } button.on { background:var(--teal); color:#062; color:#04201d; font-weight:600; }
  input[type=range] { flex:1; min-width:140px; accent-color:var(--gold); }
  .cap h2 { margin:6px 0 4px; font-size:18px; } .cap p { margin:0; color:#cfd6d3; white-space:pre-line; }
  .meta { color:var(--dim); font-size:12px; margin-top:4px; }
  .strip { display:flex; gap:6px; overflow-x:auto; padding:12px 0; scroll-snap-type:x mandatory; }
  .strip img { height:64px; aspect-ratio:16/9; object-fit:cover; border-radius:4px; opacity:.55; cursor:pointer; border:2px solid transparent; scroll-snap-align:center; }
  .strip img.cur { opacity:1; border-color:var(--gold); }
  .stage-tag { display:inline-block; padding:1px 8px; border-radius:10px; background:#243033; color:var(--gold); font-size:12px; margin-right:6px; }
  .empty { padding:40px; text-align:center; color:var(--dim); }
</style>
</head>
<body>
<header><h1><b>Sarno</b> <i>Legends</i> · build log</h1><span class="sub">Every screenshot taken while the game was built, in order. Press play to watch it come together.</span></header>
<main>
  <div class="viewer"><img id="a" alt=""><img id="b" alt="" style="opacity:0"><span class="badge" id="badge"></span></div>
  <div class="controls">
    <button id="prev" title="Previous (←)">◀</button>
    <button id="play" title="Play / pause (space)">▶ Play</button>
    <button id="next" title="Next (→)">▶</button>
    <input type="range" id="scrub" min="0" max="0" value="0">
    <button id="spd" title="Speed">1 fps</button>
  </div>
  <div class="cap"><h2 id="title"></h2><p id="caption"></p><div class="meta" id="meta"></div></div>
  <div class="strip" id="strip"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let frames = [], i = 0, timer = null, front = 'a';
const speeds = [1, 2, 4, 0.5]; let si = 0;
fetch('frames.json', { cache: 'no-store' }).then(r => r.json()).then(f => {
  frames = f; if (!frames.length) { document.querySelector('main').innerHTML = '<p class="empty">No frames yet.</p>'; return; }
  $('scrub').max = frames.length - 1;
  frames.forEach((fr, k) => { const t = new Image(); t.src = fr.file; t.loading = 'lazy'; t.title = fr.n + ' · ' + fr.title; t.onclick = () => show(k); $('strip').appendChild(t); });
  const h = parseInt(location.hash.slice(1)); show(Number.isFinite(h) ? Math.max(0, Math.min(frames.length - 1, h - 1)) : 0);
});
function show(k) {
  i = (k + frames.length) % frames.length; const fr = frames[i];
  const back = front === 'a' ? 'b' : 'a';
  const img = $(back); img.onload = () => { img.style.opacity = 1; $(front).style.opacity = 0; front = back; }; img.src = fr.file;
  $('badge').textContent = `${fr.n} / ${frames.at(-1).n}`;
  $('title').innerHTML = `<span class="stage-tag">stage ${fr.stage}</span>${fr.title}`;
  $('caption').textContent = fr.caption || ''; $('meta').textContent = fr.date || '';
  $('scrub').value = i; history.replaceState(null, '', '#' + fr.n);
  [...$('strip').children].forEach((t, k) => t.classList.toggle('cur', k === i));
  $('strip').children[i]?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  [1, 2].forEach(d => { const n = frames[i + d]; if (n) new Image().src = n.file; });
}
function play(on) {
  clearInterval(timer); timer = null; $('play').classList.toggle('on', on); $('play').textContent = on ? '❚❚ Pause' : '▶ Play';
  if (on) timer = setInterval(() => { if (i >= frames.length - 1) return play(false); show(i + 1); }, 1000 / speeds[si]);
}
$('prev').onclick = () => { play(false); show(i - 1); };
$('next').onclick = () => { play(false); show(i + 1); };
$('play').onclick = () => { if (!timer && i >= frames.length - 1) show(0); play(!timer); };
$('scrub').oninput = e => { play(false); show(+e.target.value); };
$('spd').onclick = () => { si = (si + 1) % speeds.length; $('spd').textContent = speeds[si] + ' fps'; if (timer) play(true); };
addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('next').click(); else if (e.key === 'ArrowLeft') $('prev').click(); else if (e.key === ' ') { e.preventDefault(); $('play').click(); } });
</script>
</body>
</html>
