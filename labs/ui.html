<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>UI lab: combat HUD</title>
<style>
  /* the fake stage: a static painted-looking room behind the HUD (the real one is render/stage.js) */
  #fake-stage { position: fixed; inset: 0; overflow: hidden; z-index: 0;
    background:
      radial-gradient(60% 45% at 24% 30%, #f5c78a33, transparent 70%),
      radial-gradient(50% 40% at 78% 26%, #7fd0ff22, transparent 70%),
      linear-gradient(180deg, #1c2a2c 0%, #24393a 38%, #2c3b36 52%, #1a2220 53%, #121918 100%); }
  #fake-stage::before { content: ''; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, #0000 0 11.5%, #ffffff07 11.5% 12%),
      linear-gradient(180deg, transparent 0 18%, #e9f5e622 18% 19.5%, transparent 19.5%),
      radial-gradient(120% 70% at 50% 120%, #0000, #000b 70%); }
  #fake-stage::after { content: ''; position: absolute; inset: 0; opacity: .22; background-image: var(--card-brush); background-size: 90vw 50vh; }
  .fake-actor { position: absolute; transform: translate(-50%, -100%); pointer-events: none; }
  .fake-actor svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .fake-actor.dead { opacity: 0; transition: opacity .8s .3s, transform .8s .3s; transform: translate(-50%, -96%) rotate(6deg); }
  .fake-actor.hit { animation: fake-hit .25s; }
  @keyframes fake-hit { 30% { filter: brightness(3); translate: 8px 0; } }
  #lab-bar { position: fixed; right: 8px; top: 50%; transform: translateY(-50%); z-index: 90; display: flex; flex-direction: column; gap: 4px; }
  #lab-bar button { font: 600 11px/1 Oswald, system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: #ece4d2;
    background: #20323acc; border: 1px solid #2d4249; border-radius: 5px; padding: 6px 8px; cursor: pointer; }
  body.shots #lab-bar { display: none; }
  .sheet { position: absolute; inset: 0; z-index: 5; overflow: auto; padding: 16px; display: flex; flex-wrap: wrap; gap: 14px; align-content: flex-start; background: #0d1416; touch-action: pan-y; }
  .sheet .ic { width: 96px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 11px/1.1 ui-monospace, monospace; color: #9fb0ae; text-align: center; word-break: break-all; }
  .sheet .ic svg { width: 44px; height: 44px; color: #ece4d2; }
</style>
</head>
<body>
<div id="fake-stage"></div>
<div id="ui"></div>
<div id="lab-bar"></div>
<script type="module" src="./ui.js"></script>
</body>
</html>
